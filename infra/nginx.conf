server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Docusaurus writes each page as a flat <route>/index.html directory,
    # so falling back to $uri/ (which nginx's `index` directive then
    # resolves to index.html) covers routing; no $uri.html case needed
    # since Docusaurus doesn't emit flat <route>.html files.
    location / {
        try_files $uri $uri/ =404;
    }

    # Docusaurus build output - hashed filenames under assets/, safe to
    # cache for a long time.
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
